# Japan tenant (Org Code LJP). Created 25 Nov 2026 from India's settings; every India-specific value was removed or set to
# TO-BE-PROVIDED: recipient mailbox, bug sheet, Drive evidence folder, case workbooks, samples, Direct BL rules, branch airports.
# Fill them from the tenant's own requirements; never copy India's values.
# Mapping validation (type aliases, document -> parent) is the same for every tenant.
gmail:
  query: in:inbox subject:(pre-alert OR prealert) has:attachment -label:Nexus/Forwarded newer_than:2d
  forward_to: TO-BE-PROVIDED
  processed_label: Nexus/Forwarded
  credentials_file: secrets/gmail_credentials.json
  token_file: secrets/gmail_token.json
  max_messages_per_run: 50
references:
  match_by: hawb
  hawb_pattern: \b(UNF\d{4,10})\b
  job_pattern: (?<![A-Za-z0-9])(FJ-\d{4,10})(?!\d)
  mawb_pattern: \b(\d{3}-?\d{8})\b
nexus:
  base_url: https://uat.sentinel.unifo.in
  home_path: /sentinel-nexus/email
  login_path: /auth/logIn
  organisation_code: LJP
  session_file: state/japan/nexus_session.json
  navigation_timeout_ms: 30000
timing:
  prealert_wait_seconds: 600
  prealert_poll_seconds: 30
  approval_wait_seconds: 900
  approval_poll_seconds: 30
  ui_retries: 2
paths:
  state_dir: state/japan
  runs_dir: runs/japan
  corrections_dir: corrections/japan
xml_capture:
  mode: text
local_docs:
  preflight_reuse_minutes: 60
  email_gap_seconds: 30
  case_email_gap_seconds:
    REG-011: 60
  root: knowledge_base/japan
  consolidated_dir: consolidated
  individual_dir: individual
  subject_tag: QA agent trigger / Don't delete / Regression testing
  same_subject_cases:
    UNR-001:
      ref: FJ-0003315
      types: MASTER+MANIFEST+HOUSE
  priority: high
  archive_after_send: false
  sent_dir: sent
  skip_already_sent: false
  consolidated_subject_template: '{tag} | Pre-Alert {ref} | CONSOLIDATED ({types})'
  subject_template: '{tag} | Pre-Alert {ref} | INDIVIDUAL | {doc}'
  doc_labels:
    MBL: MASTER
    HBL: HOUSE
    INVOICE: INVOICE
    PACKING: PACKING LIST
    MANIFEST: MANIFEST
    SHIPPERDOC: SHIPPER DOC
    DEBITNOTE: DEBIT NOTE
    DELIVERY: DELIVERY NOTE
    PO: PO
    OTHER: DOCUMENT
  filename_types:
    MASTER: MBL
    MBL: MBL
    MAWB: MBL
    HOUSE: HBL
    HBL: HBL
    HAWB: HBL
    INVOICE: INVOICE
    PACKING: PACKING
    PACKINGLIST: PACKING
    PL: PACKING
    PKL: PACKING
    MANIFEST: MANIFEST
    SHIPPERDOC: SHIPPERDOC
    SLI: SHIPPERDOC
    CERTIFICATE: SHIPPERDOC
    PO: PO
    DEBITNOTE: DEBITNOTE
    DELIVERY: DELIVERY
    DELIVERYNOTE: DELIVERY
